[project]
name = "geosnap"
version = "0.1.0"
description = "Retrieval-based visual geolocation for Moscow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "faiss-cpu>=1.8,<2.0",
  "h3>=4.1,<5.0",
  "huggingface-hub>=0.27,<2.0",
  "imagehash>=4.3,<5.0",
  "matplotlib>=3.9,<4.0",
  "mapbox-vector-tile>=2.1,<3.0",
  "mercantile>=1.2,<2.0",
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "pandas>=2.1,<3.0",
  "pillow>=10.0,<13.0",
  "prettytable>=3.9,<4.0",
  "psycopg2-binary>=2.9,<3.0",
  "pydantic>=2.8,<3.0",
  "pytorch-lightning>=2.1,<3.0",
  "pytorch-metric-learning>=2.3,<3.0",
  "pyarrow>=15.0,<26.0",
  "python-multipart>=0.0.9,<1.0",
  "requests>=2.31,<3.0",
  "safetensors>=0.4,<1.0",
  "shapely>=2.1,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "timm>=1.0,<2.0",
  "torch>=2.4,<3.0",
  "torchvision>=0.19,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
  "scikit-learn>=1.5,<2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "apps/backend"]
testpaths = ["ml", "apps/backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
