name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-smoke:
    name: test-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend lint (if present)
        working-directory: apps/frontend
        run: npm run lint --if-present

      - name: Frontend tests (if present)
        working-directory: apps/frontend
        run: npm test --if-present -- --run

      - name: Frontend build
        working-directory: apps/frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_MAP_TILE_URL: https://tiles.example.invalid/{z}/{x}/{y}.png
          VITE_MAP_ATTRIBUTION: CI configuration only
        run: |
          npm run build
          ! grep -R -E 'localhost:(3000|8000)' dist

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --locked --extra dev

      - name: Python lint
        run: .venv/bin/ruff check .

      - name: Python tests
        run: .venv/bin/pytest -q

      - name: Production config and artifact-manifest schema
        run: |
          test "$(sha256sum configs/moscow_production_frozen.json | cut -d ' ' -f1)" = "9c0c38f93d4c4f76eff8ef821508da0aafdd104f04ddd932b48d2834bbd2984e"
          .venv/bin/python -c "from ml.artifacts import load_artifact_manifest; manifest=load_artifact_manifest('configs/production_artifacts.json'); assert manifest.version == '1'"

      - name: Production Compose validation
        run: make production-config

      - name: Production container builds
        run: |
          docker build --platform linux/amd64 -t geosnap-backend:ci -f apps/backend/Dockerfile .
          docker build --platform linux/amd64 -t geosnap-telegram-bot:ci -f apps/telegram_bot/Dockerfile .
          docker build --build-arg VITE_API_BASE_URL=/api --build-arg 'VITE_MAP_TILE_URL=https://tiles.example.invalid/{z}/{x}/{y}.png' --build-arg 'VITE_MAP_ATTRIBUTION=CI configuration only' -t geosnap-proxy:ci -f infra/caddy/Dockerfile .
          docker run --rm --platform linux/amd64 geosnap-telegram-bot:ci python -m apps.telegram_bot --validate-config
          docker run --rm --platform linux/amd64 geosnap-telegram-bot:ci python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('faiss') is None"

      - name: Functional image-to-API smoke
        run: .venv/bin/pytest -q apps/backend/tests/test_api.py::test_api_runs_real_fixture_embedding_index_localization_and_thumbnail

      - name: Docker liveness and fail-safe readiness smoke
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down -v
          }
          trap cleanup EXIT

          docker compose up -d --build backend frontend

          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:8000/health | grep -q "\"status\":\"ok\""; do sleep 2; done'
          ready_status="$(curl -sS -o /tmp/geosnap-ready.json -w '%{http_code}' http://127.0.0.1:8000/ready)"
          test "$ready_status" = "503"
          python - <<'PY'
          import json

          with open('/tmp/geosnap-ready.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['ready'] is False
          assert payload['status'] in {'model_not_ready', 'index_not_ready'}
          PY
